<div class="feedback-container">
  <h2><i class="fa-solid fa-comments"></i> Submit Your Feedback</h2>
  <p>We value your opinion. Let us know how we're doing!</p>
  
  <div id="feedbackForm">
    <div class="form-group">
      <label>How would you rate your experience?</label>
      <div class="star-rating">
        <input type="radio" id="star5" name="rating" value="5" /><label for="star5" title="5 stars"></label>
        <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="4 stars"></label>
        <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="3 stars"></label>
        <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="2 stars"></label>
        <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="1 star"></label>
      </div>
    </div>
    
    <div class="form-group">
      <label for="feedbackComment">Comments (Optional)</label>
      <textarea id="feedbackComment" placeholder="Tell us what you loved or where we can improve..."></textarea>
    </div>
    
    <button id="submitFeedbackBtn" class="btn primary">Submit Feedback</button>
    
    <div id="feedbackStatus" class="hidden"></div>
  </div>
</div>
